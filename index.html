<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<style>
  body{margin:0;height:100vh;background:radial-gradient(circle at center,#06222e,#02080c);
    color:#5ee7ff;font-family:Arial,sans-serif;display:flex;flex-direction:column;
    align-items:center;justify-content:center;overflow:hidden}
  h1{letter-spacing:12px;font-weight:300;text-shadow:0 0 15px #00d4ff;margin:0 0 30px}
  .core{position:relative;width:220px;height:220px}
  .ring{position:absolute;border-radius:50%;border:2px solid #00d4ff;box-shadow:0 0 20px #00d4ff}
  .r1{inset:0;border-style:dashed;animation:spin 14s linear infinite}
  .r2{inset:25px;border-color:#5ee7ff;border-top-color:transparent;animation:spin 6s linear infinite reverse}
  .r3{inset:55px;animation:pulse 2.5s ease-in-out infinite}
  .dot{position:absolute;inset:90px;border-radius:50%;background:#00d4ff;box-shadow:0 0 40px #00d4ff}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{transform:scale(1.15);opacity:.5}}
  #stato{margin:30px 0 15px;font-size:14px;letter-spacing:3px;opacity:.8}
  .barra{display:flex;gap:8px;width:80%;max-width:500px}
  input{flex:1;padding:12px;background:#031820;border:1px solid #00d4ff;border-radius:8px;
    color:#5ee7ff;font-size:16px;outline:none}
  button{padding:12px 18px;background:#00d4ff;border:none;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
  <h1>JARVIS</h1>
  <div class="core">
    <div class="ring r1"></div><div class="ring r2"></div>
    <div class="ring r3"></div><div class="dot"></div>
  </div>
  <div id="stato">SISTEMA ONLINE</div>
  <div class="barra">
    <input id="testo" placeholder="Scrivi a Jarvis...">
    <button onclick="document.getElementById('stato').textContent='IN ATTESA DEL CERVELLO (TAPPA 3)'">Invia</button>
  </div>
</body>
</html>
